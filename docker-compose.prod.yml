# =============================================================================
# PRODUCTION stack - used on the AWS EC2 host by the CI/CD pipeline.
#
# Key differences vs. docker-compose.yml:
#   * `app` is NOT built - it pulls an immutable, commit-SHA tagged image
#   * every service has `restart: unless-stopped`
#   * log rotation is configured (prevents disk exhaustion)
#   * PostgreSQL is never published to the host
#   * TLS is terminated by Nginx; Certbot renews certificates in-place
#
# The pipeline writes /opt/devops-cicd/deploy/.env with:
#   APP_IMAGE=ghcr.io/<owner>/devops-cicd-app
#   APP_TAG=sha-<commit-sha>
# and then runs:  docker compose --env-file .env -f docker-compose.prod.yml ...
# =============================================================================

name: devops-cicd-prod

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - internal only. No `ports:` mapping => unreachable from the
  # internet. The security group also blocks 5432 from any source.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: devops-cicd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devops_net
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Flask application - pulled from GHCR by immutable commit-SHA tag.
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}:${APP_TAG:?APP_TAG is required}
    container_name: devops-cicd-app
    restart: unless-stopped
    env_file:
      - ./secrets.env
    environment:
      APP_NAME: ${APP_NAME:-devops-cicd-app}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: production
      APP_PORT: "8000"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Read-only host state for the monitoring dashboard. The container can
      # READ these JSON snapshots but can never write to them, and it never
      # gets access to the Docker socket or to a shell on the host.
      HOST_STATE_DIR: /app/hoststate
      HOST_LOG_DIR: /app/hostlogs
    volumes:
      - /opt/devops-cicd/state:/app/hoststate:ro
      - /opt/devops-cicd/logs:/app/hostlogs:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops_net
    healthcheck:
      test:
        ["CMD", "python", "-c", "import sys,urllib.request;r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4);sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Nginx - reverse proxy + TLS termination. Only 80/443 are published.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: devops-cicd-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - devops_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Certbot - only used on demand (profile "tools") to issue/renew certificates.
  #   docker compose --profile tools run --rm certbot renew --dry-run
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: devops-cicd-certbot
    profiles: ["tools"]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - devops_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
  certbot_etc:
    driver: local
  certbot_www:
    driver: local

networks:
  devops_net:
    driver: bridge
    name: devops-cicd-net
