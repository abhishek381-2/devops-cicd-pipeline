# =============================================================================
# DEVELOPMENT stack: Flask app + PostgreSQL + Nginx reverse proxy.
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# Production uses docker-compose.prod.yml (immutable image tags, no build).
# =============================================================================

name: devops-cicd-dev

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - private to the Docker network, NEVER published to the host.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: devops-cicd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-devops_cicd}
      # Deterministic collation so the schema behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devops_net
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-devops_cicd} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Flask application (Gunicorn).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: ${APP_IMAGE:-devops-cicd-app}:${APP_TAG:-local}
    container_name: devops-cicd-app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-devops-cicd-app}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8000"
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-devops_cicd}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops_net
    healthcheck:
      test:
        ["CMD", "python", "-c", "import sys,urllib.request;r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4);sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Nginx - the only service published on the host.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: devops-cicd-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - devops_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local

networks:
  devops_net:
    driver: bridge
    name: devops-cicd-net
