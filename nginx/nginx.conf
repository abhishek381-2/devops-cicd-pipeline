##############################################################################
# Main Nginx configuration for the devops-cicd-app stack.
# Mounted read-only at /etc/nginx/nginx.conf inside the nginx container.
##############################################################################

user  nginx;
# auto tunes the worker count to the number of CPU cores available
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging -----------------------------------------------------------
    # Logs are emitted to stdout/stderr so `docker logs` captures them.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                    'ua=$upstream_addr';
    access_log /var/log/nginx/access.log  main;

    # ---- Rate limiting -----------------------------------------------------
    # NOTE: limit_req_zone is only valid in the `http` context - it must NOT be
    # placed inside a `server` block, otherwise Nginx refuses to start.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    # ---- Performance -------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;      # do not leak the Nginx version

    # ---- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml application/xml+rss text/javascript
                      image/svg+xml;

    # ---- Client limits -----------------------------------------------------
    client_max_body_size 2m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # ---- Include the virtual hosts ----------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
