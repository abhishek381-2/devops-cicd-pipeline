##############################################################################
# DEFAULT (HTTP-only) virtual host.
#
# This file is active out of the box - it works with or without a domain name
# and before any TLS certificate exists. It is used by:
#   * the development docker-compose stack (http://localhost:8080)
#   * the production host before `scripts/setup-ssl.sh` has been run
#
# Once SSL is configured, `scripts/setup-ssl.sh` replaces this file with the
# rendered `app-https.conf` (see nginx/templates/app-https.conf.template).
##############################################################################

upstream devops_cicd_app {
    server app:8000;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ---- Security headers ---------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                   always;

    # The monitoring dashboard ships its own CSS/JS and uses no eval, no
    # inline <script> and no third-party origins - so a strict CSP is safe.
    # `style-src 'unsafe-inline'` is required because the chart renderer sets
    # inline `style="width:..%"` attributes on the usage bars.
    add_header Content-Security-Policy
               "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
               always;

    # ---- Certbot HTTP-01 challenge (must stay reachable over plain HTTP) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Static assets (dashboard CSS/JS) -----------------------------------
    # Served by Flask through the proxy, but cached by the browser for an hour.
    # `expires` does not reset add_header inheritance, so the security headers
    # above still apply to these responses.
    location /static/ {
        proxy_pass         http://devops_cicd_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires            1h;
        access_log         off;
    }

    # ---- Reverse proxy ------------------------------------------------------
    location / {
        proxy_pass         http://devops_cicd_app;
        proxy_http_version 1.1;

        # The Flask app also sets X-Content-Type-Options on every response.
        # Hide the upstream copy so the header is sent exactly once.
        proxy_hide_header  X-Content-Type-Options;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # The health endpoint is not rate limited (the CI pipeline polls it).
    location = /health {
        proxy_pass       http://devops_cicd_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
