# =============================================================================
# devops-cicd-app - End-to-end CI/CD pipeline
# =============================================================================
# Stage 1  CHECKOUT       - fetch the code, set up Python
# Stage 2  LINT           - Ruff + Black (code quality gate)
# Stage 3  TEST           - Pytest (SQLite + real PostgreSQL service container)
# Stage 4  BUILD          - Docker Buildx, commit-SHA + latest tags, GHA cache
# Stage 5  SECURITY SCAN  - Trivy (CRITICAL/HIGH = build failure)
# Stage 6  PUSH           - push to GitHub Container Registry (GHCR)
# Stage 7  DEPLOY         - SSH to EC2, pull image, Docker Compose rollout
# Stage 8  VALIDATION     - hit /health until it returns HTTP 200
# Stage 9  ROLLBACK       - restore the previous image if validation failed
# =============================================================================
name: CI/CD Pipeline

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after a successful build"
        required: false
        default: false
        type: boolean

# ---------------------------------------------------------------------------
# Concurrency - never run two deployments of the same branch at once.
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ---------------------------------------------------------------------------
# Least-privilege permissions.
# `packages: write` is required to push to GHCR, `security-events: write` to
# upload the Trivy SARIF report. Pull requests from forks get read-only
# permissions automatically.
# ---------------------------------------------------------------------------
permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

# ---------------------------------------------------------------------------
# Global environment variables shared by every stage.
# ---------------------------------------------------------------------------
env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Fallback tag used for pull requests and manual builds.
  DEFAULT_TAG: ${{ github.sha }}

jobs:
  # ===========================================================================
  # STAGES 1-3: CHECKOUT, LINT, TEST
  # ===========================================================================
  build-and-test:
    name: "1-3 | Checkout, Lint & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: devops_cicd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d devops_cicd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ---------------- STAGE 1: CHECKOUT ----------------------------------
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe` works

      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ---------------- STAGE 2: LINT ---------------------------------------
      - name: "Lint with Ruff"
        run: |
          echo "::group::Ruff - linting"
          ruff check . --output-format=github
          echo "::endgroup::"
          ruff check . --output-format=concise

      - name: "Check formatting with Black"
        run: |
          echo "::group::Black - format check"
          black --check --diff .
          echo "::endgroup::"

      - name: "Security lint (bandit rules via Ruff)"
        run: |
          # Ruff's S-rules catch common Python security mistakes.
          ruff check . --select S --output-format=concise

      - name: "Shellcheck the deployment scripts"
        run: |
          shellcheck --version
          shellcheck -S style scripts/*.sh

      # ---------------- STAGE 3: TEST ---------------------------------------
      - name: "Run unit tests (SQLite)"
        run: |
          echo "::group::Pytest - in-memory SQLite"
          pytest -v --color=yes
          echo "::endgroup::"

      - name: "Run integration tests (PostgreSQL)"
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://appuser:testpassword@localhost:5432/devops_cicd_test
        run: |
          echo "::group::Pytest - real PostgreSQL"
          pytest -v --color=yes
          echo "::endgroup::"

      - name: "Upload test reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn

      - name: "Upload coverage to Codecov"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # STAGE 4: BUILD
  # ===========================================================================
  build-image:
    name: "4 | Build Docker image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      latest_tag: ${{ steps.meta.outputs.latest_tag }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Compute image tags"
        id: meta
        run: |
          # The owner/repository must be lower-case for the OCI registry.
          IMAGE_REPO="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA}"
          LATEST_TAG="latest"
          {
            echo "image_repo=${IMAGE_REPO}"
            echo "image_ref=${IMAGE_REPO}:${SHA_TAG}"
            echo "sha_tag=${SHA_TAG}"
            echo "latest_tag=${LATEST_TAG}"
          } >>"$GITHUB_OUTPUT"
          echo "Image will be built as: ${IMAGE_REPO}:${SHA_TAG}"

      - name: "Build image (no push yet)"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true            # keep it in the local daemon so Trivy can scan it
          push: false
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.latest_tag }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=devops-cicd-app
          cache-to: type=gha,mode=max,scope=devops-cicd-app
          provenance: false
          # NOTE: no `sbom: true` here. This step uses `load: true` (the docker
          # exporter), which cannot export SBOM/provenance attestations and
          # fails with "docker exporter does not currently support exporting
          # SBOM". The SBOM is generated in the push stage instead.

      - name: "Image build report"
        run: |
          echo "### Docker image built :success:" >>"$GITHUB_STEP_SUMMARY"
          echo "" >>"$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >>"$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >>"$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.meta.outputs.image_ref }}\` |" >>"$GITHUB_STEP_SUMMARY"
          echo "| Size | $(docker image inspect ${{ steps.meta.outputs.image_ref }} --format '{{.Size}}' | numfmt --to=iec) |" >>"$GITHUB_STEP_SUMMARY"
          echo "" >>"$GITHUB_STEP_SUMMARY"

      - name: "Save the built image as a tar artifact"
        run: |
          mkdir -p /tmp/image
          docker save ${{ steps.meta.outputs.image_ref }} | gzip > /tmp/image/app.tar.gz
          echo "$(stat -c%s /tmp/image/app.tar.gz) bytes" >>"$GITHUB_STEP_SUMMARY"

      - name: "Upload the image artifact for the scan stage"
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/image/app.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # STAGE 5: SECURITY SCAN (Trivy)
  # ===========================================================================
  security-scan:
    name: "5 | Trivy security scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-image

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Download the built image"
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp/image

      - name: "Load the image into Docker"
        run: |
          gunzip -c /tmp/image/app.tar.gz | docker load
          docker images

      - name: "Trivy - scan the Docker image"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image_ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"          # fail the pipeline on a policy violation
          vuln-type: os,library

      - name: "Upload SARIF report to GitHub Security"
        if: always()
        # Code Scanning needs GitHub Advanced Security on private repos. On a
        # public repo it just works; elsewhere this must not fail the build -
        # the Trivy step above is the real gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-scan

      - name: "Trivy - human readable summary"
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image_ref }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: "Trivy - scan the source tree (secrets & misconfigurations)"
        # Informational: the blocking gate is the IMAGE scan above (that is the
        # artefact that actually ships). A brand-new CVE in a transitive
        # dependency should not break an unrelated commit.
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: "Store the scan report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-image.sarif
          retention-days: 14
          if-no-files-found: warn

      # The dashboard shows the real Trivy counters - never invented numbers.
      - name: "Trivy - machine readable report for the dashboard"
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-image.outputs.image_ref }}
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"

      - name: "Build the Trivy summary for the monitoring dashboard"
        if: always()
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          if [ ! -f trivy-image.json ]; then
            echo "::warning::No Trivy JSON report was produced - the dashboard keeps the previous snapshot."
            exit 0
          fi
          python3 scripts/build-security-summary.py \
            --trivy trivy-image.json \
            --output security.json \
            --image "${IMAGE_REF}" \
            --policy "CRITICAL=0,HIGH=0"

      - name: "Upload the security summary for the dashboard"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security.json
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # STAGE 6: PUSH TO GHCR
  # ===========================================================================
  push-image:
    name: "6 | Push to GHCR"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-image, security-scan]      # only runs if the scan passed
    # Pull requests must never push to the registry.
    if: github.event_name != 'pull_request'

    outputs:
      image_ref: ${{ needs.build-image.outputs.image_ref }}
      image_repo: ${{ needs.build-image.outputs.image_repo }}
      sha_tag: ${{ needs.build-image.outputs.sha_tag }}
      latest_tag: ${{ needs.build-image.outputs.latest_tag }}

    steps:
      - name: "Log in to the GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Push the image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ needs.build-image.outputs.image_ref }}
            ${{ needs.build-image.outputs.image_repo }}:${{ needs.build-image.outputs.latest_tag }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=devops-cicd-app
          provenance: false
          sbom: true

      - name: "Verify the image is in the registry"
        run: |
          echo "Pushed: ${{ needs.build-image.outputs.image_ref }}"
          echo "Pushed: ${{ needs.build-image.outputs.image_repo }}:${{ needs.build-image.outputs.latest_tag }}"

  # ===========================================================================
  # STAGES 7-9: DEPLOY, VALIDATION, ROLLBACK
  # ===========================================================================
  deploy:
    name: "7-9 | Deploy, Validate & Rollback"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: push-image
    # Pull requests must never touch production.
    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    environment:
      # NOTE: `secrets` is not an allowed context inside `environment.url`
      # (only env / github / inputs / job / matrix / needs / runner / steps /
      # strategy / vars are). Using it here makes the WHOLE workflow invalid,
      # so every run fails instantly with "startup_failure".
      # `vars` IS allowed, so the clickable deployment URL uses the repository
      # *variable* APP_DOMAIN (Settings > Secrets and variables > Actions >
      # Variables tab) and is simply omitted while that variable is unset.
      name: production
      url: ${{ vars.APP_DOMAIN && format('https://{0}/health', vars.APP_DOMAIN) }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ---------------- STAGE 7: DEPLOY -------------------------------------
      - name: "Preflight - are the deployment secrets configured?"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          MISSING=""
          [[ -z "${EC2_HOST}" ]]            && MISSING="${MISSING} EC2_HOST"
          [[ -z "${EC2_USER}" ]]            && MISSING="${MISSING} EC2_USER"
          [[ -z "${EC2_SSH_PRIVATE_KEY}" ]] && MISSING="${MISSING} EC2_SSH_PRIVATE_KEY"
          if [[ -n "${MISSING}" ]]; then
            echo "::error title=Deployment secrets missing::Missing:${MISSING}"
            echo ""
            echo "This job needs the AWS/EC2 repository secrets. They are not set yet,"
            echo "so there is no server to deploy to. This is expected BEFORE the AWS"
            echo "setup is finished - it is NOT a bug in the application."
            echo ""
            echo "Fix: Settings > Secrets and variables > Actions > New repository secret"
            echo "     and add EC2_HOST, EC2_USER, EC2_SSH_PRIVATE_KEY,"
            echo "     GHCR_USERNAME, GHCR_TOKEN, APP_DOMAIN, PRODUCTION_ENV."
            echo "     See docs/DEPLOY_STEP_BY_STEP.md - PHASE K."
            exit 1
          fi
          echo "All required deployment secrets are present."

      - name: "Write the SSH private key to a temporary file"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: "Add the EC2 host key"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          if [ -n "${EC2_KNOWN_HOSTS}" ]; then
            # Preferred: pin the host key that you copied from the EC2 console.
            echo "${EC2_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
            echo "Pinned host key from the EC2_SSH_KNOWN_HOSTS secret."
          else
            # Fallback: trust-on-first-use (TOFU). Verify the fingerprint in the
            # EC2 console the first time you run this.
            ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::Host key was trusted on first use (ssh-keyscan)."
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: "Log in to GHCR from the EC2 server"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          # The token is piped over SSH - it never touches the GitHub log.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2_deploy_key \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            'read -r TOKEN; echo "$TOKEN" | docker login ghcr.io -u "'"$GHCR_USERNAME"'" --password-stdin && rm -f ~/.docker/config.json.password'

      - name: "Sync the deployment artefacts to the EC2 server"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          REMOTE="${EC2_USER}@${EC2_HOST}:/opt/devops-cicd/deploy"
          # NOTE: secrets.env is NOT part of the repository and is never synced.
          rsync -az -e "ssh ${SSH_OPTS}" docker-compose.prod.yml "${REMOTE}/"
          rsync -az -e "ssh ${SSH_OPTS}" nginx/ "${REMOTE}/nginx/"
          rsync -az -e "ssh ${SSH_OPTS}" scripts/ "${REMOTE}/scripts/"
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" 'chmod +x /opt/devops-cicd/deploy/scripts/*.sh'

      - name: "Deploy the new image (Docker Compose rollout)"
        id: deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_REF: ${{ needs.push-image.outputs.image_ref }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"
          echo "Deploying ${IMAGE_REPO}:${IMAGE_TAG} ..."
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" bash -s <<EOF
            set -Eeuo pipefail
            cd /opt/devops-cicd/deploy
            export APP_ENV=production
            export PRODUCTION_ENV="${PRODUCTION_ENV}"
            ./scripts/deploy.sh --image "${IMAGE_REPO}" --tag "${IMAGE_TAG}"
          EOF

      - name: "Collect the deployment logs"
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" bash -s <<'EOF'
            echo "=== docker compose ps ==="
            cd /opt/devops-cicd/deploy && docker compose -f docker-compose.prod.yml ps || true
            echo "=== app logs (last 100) ==="
            docker compose -f docker-compose.prod.yml logs --tail=100 app || true
            echo "=== deployment logs ==="
            ls -lt /opt/devops-cicd/logs | head -20 || true
            for f in $(ls -t /opt/devops-cicd/logs/deploy-*.log 2>/dev/null | head -3); do
              echo "--- $f ---"; cat "$f"
            done
          EOF

      # ---------------- STAGE 8: POST-DEPLOYMENT VALIDATION ----------------
      - name: "Validate the deployment from the server"
        id: validate
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" \
            "/opt/devops-cicd/deploy/scripts/health-check.sh --url http://localhost/health --retries 10 --interval 6"

      - name: "Validate the deployment through the public endpoint"
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # Retry a few times: the new container may still be warming up.
          for attempt in 1 2 3 4 5; do
            echo "Public health-check attempt ${attempt}/5 ..."
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 \
                    "https://${APP_DOMAIN}/health" || echo "000")"
            if [ "${code}" = "200" ]; then
              cat /tmp/health.json; echo
              echo "Deployment validated: HTTP 200 from https://${APP_DOMAIN}/health"
              exit 0
            fi
            echo "  -> HTTP ${code}, retrying in 10s ..."
            sleep 10
          done
          echo "::error::Public health check never returned HTTP 200"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: "Verify the running version matches the deployed tag"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_REF: ${{ needs.push-image.outputs.image_ref }}
        run: |
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" bash -s <<EOF
            set -Eeuo pipefail
            RUNNING="\$(docker inspect -f '{{.Config.Image}}' devops-cicd-app)"
            echo "Running image : \${RUNNING}"
            echo "Expected image: ${IMAGE_REF}"
            if [ "\${RUNNING}" != "${IMAGE_REF}" ]; then
              echo "::error::Deployed image does not match the expected tag"
              exit 1
            fi
          EOF

      # ---------------- STAGE 9: ROLLBACK -----------------------------------
      - name: "Rollback to the previous version"
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" bash -s <<'EOF'
            set -Eeuo pipefail
            cd /opt/devops-cicd/deploy
            ./scripts/rollback.sh || {
              echo "::error::The rollback itself failed - manual intervention required"
              exit 1
            }
          EOF

      - name: "Mark the deployment as failed"
        if: failure()
        run: |
          echo "::error::Deployment failed and the previous version was restored."
          exit 1

  # ===========================================================================
  # STAGE 10: DASHBOARD STATUS
  #
  # Publishes the REAL pipeline and Trivy snapshots to the host so the
  # monitoring dashboard shows the state of this run instead of placeholders.
  # The snapshots are plain JSON in /opt/devops-cicd/state, which the app
  # container reads through a READ-ONLY bind mount.
  # ===========================================================================
  update-dashboard-status:
    name: "10 | Publish the dashboard status"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    environment:
      name: production

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Preflight - is there a server to publish to?"
        id: preflight
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [[ -z "${EC2_HOST}" ]]; then
            echo "::notice title=Dashboard snapshot skipped::EC2_HOST is not configured yet, so there is no host to publish the pipeline status to. See docs/DEPLOY_STEP_BY_STEP.md - PHASE K."
            echo "configured=false" >>"${GITHUB_OUTPUT}"
          else
            echo "configured=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: "Download the security summary"
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: security-summary
          path: /tmp/dashboard
        continue-on-error: true

      - name: "Write the SSH private key to a temporary file"
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: "Add the EC2 host key"
        # Must be gated too: without EC2_HOST, `ssh-keyscan ""` exits non-zero
        # and turns this whole job red even though nothing is misconfigured.
        if: steps.preflight.outputs.configured == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          if [ -n "${EC2_KNOWN_HOSTS}" ]; then
            echo "${EC2_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::Host key was trusted on first use (ssh-keyscan)."
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: "Build the pipeline status snapshot"
        if: steps.preflight.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 scripts/write-pipeline-status.py --output /tmp/dashboard/pipeline.json

      - name: "Publish the snapshots to the EC2 host"
        if: steps.preflight.outputs.configured == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS="-i ${HOME}/.ssh/ec2_deploy_key -o StrictHostKeyChecking=yes"
          REMOTE="${EC2_USER}@${EC2_HOST}"
          ssh ${SSH_OPTS} "${REMOTE}" 'mkdir -p /opt/devops-cicd/state'
          scp ${SSH_OPTS} /tmp/dashboard/pipeline.json "${REMOTE}:/opt/devops-cicd/state/pipeline.json"
          if [ -f /tmp/dashboard/security.json ]; then
            scp ${SSH_OPTS} /tmp/dashboard/security.json "${REMOTE}:/opt/devops-cicd/state/security.json"
          else
            echo "::warning::No security summary was produced - the previous snapshot was kept."
          fi
          ssh ${SSH_OPTS} "${REMOTE}" 'chmod 0644 /opt/devops-cicd/state/*.json 2>/dev/null || true'
          echo "Dashboard snapshots published to /opt/devops-cicd/state"
